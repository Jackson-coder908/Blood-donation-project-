<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeFlow | Administrative Supply Tracking</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/stock.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px 24px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .metric-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; }
        .metric-val { font-size: 2.4rem; font-weight: 700; margin: 0; }
        .panel-card { margin-bottom: 30px; background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <main class="dashboard-container">
        <h1>Smart Supply Tracking</h1>
        <p id="timestamp" style="font-size: 0.85rem; color: #64748b; font-weight: 500;"></p>
        <section class="metrics-grid">
            <div class="metric-card">
                <h4>Total Monitored Nodes</h4>
                <p class="metric-val" id="total-districts-count">0</p>
            </div>
            <div class="metric-card">
                <h4>Global Tracked Units</h4>
                <p class="metric-val" id="global-units-count">0</p>
            </div>
        </section>

        <div class="panel-card">
            <h3>📊 Regional Inventory Volume Distribution</h3>
            <canvas id="inventoryChart" style="max-height: 320px; width: 100%;"></canvas>
        </div>
    </main>

    <script>
    // Check access immediately when the page loads
    const accessKey = prompt("🔒 Enter Admin Access Key:");
    
    if (accessKey === "admin123") {
        // Just let the script load normally
        const script = document.createElement("script");
        script.src = "../js/stock.js";
        document.body.appendChild(script);
    } else {
        alert("Access Denied. Redirecting to Home...");
        window.location.href = "../index.html"; // Standard navigation that works
    }
</script>
</body>
</html>
